# Nginx reverse proxy for StonesLand (Next.js on Node, behind PM2).
#
# Install on a Hostinger VPS:
#   sudo cp deploy/nginx-stonesland.conf /etc/nginx/sites-available/stonesland
#   sudo ln -s /etc/nginx/sites-available/stonesland /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue the certificate, which rewrites the TLS lines below in place:
#   sudo certbot --nginx -d stonesland.net -d www.stonesland.net
#
# Certbot installs a systemd timer that renews automatically; verify with:
#   sudo certbot renew --dry-run

upstream stonesland_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ---------------------------------------------------------------------------
# Redirect http -> https for both hosts.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name stonesland.net www.stonesland.net;

    # Leave this reachable over http so renewals succeed.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://stonesland.net$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Canonicalise www -> apex, so one URL owns the SEO value.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.stonesland.net;

    # certbot fills these in
    ssl_certificate     /etc/letsencrypt/live/stonesland.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stonesland.net/privkey.pem;

    return 301 https://stonesland.net$request_uri;
}

# ---------------------------------------------------------------------------
# The application.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stonesland.net;

    ssl_certificate     /etc/letsencrypt/live/stonesland.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stonesland.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Product images are posted through /api/admin/upload. Keep this at or
    # above MAX_UPLOAD_BYTES or nginx rejects the request before Node sees it
    # and the admin gets an opaque 413.
    client_max_body_size 12M;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # Uploaded media, served straight off disk so image traffic never reaches
    # Node. Must match UPLOAD_DIR. The trailing slashes are significant.
    location /media/ {
        alias /home/stonesland/uploads/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Build output is content-hashed and therefore immutable.
    location /_next/static/ {
        proxy_pass http://stonesland_app;
        proxy_cache_valid 200 60m;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://stonesland_app;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }
}
